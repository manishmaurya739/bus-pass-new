<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | e-Bus Pass</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #e3f2fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      color: #1b8a90;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 10px 0;
      background: white;
      width: 100%;
      text-align: center;
      padding: 10px 0;
    }

    /* Main Pass Container */
    .card {
      background-color: #ffffff;
      background-image: url('dtc-watermark.png');
      background-repeat: repeat;
      background-size: 150px 75px;
      width: 92%;
      max-width: 650px;
      padding: 20px 0 0 0; /* Padding inside card bottom managed by bottom-section */
      position: relative;
      text-align: center;
      border: 1px solid #ddd;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .main-title {
      color: #000;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* Center Photo */
    .user-img {
      width: 160px;
      height: 180px;
      object-fit: cover;
      border: 1px solid #555;
      margin: 0 auto 10px auto;
      display: block;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      color: #000;
      margin-bottom: 12px;
    }

    .pass-type {
      font-size: 20px;
      font-weight: bold;
      color: #000;
      margin-bottom: 12px;
    }

    .pass-number-container {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .pass-label {
      color: #000;
    }

    /* Blinking Green Number */
    .blink-number {
      color: #72b270;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    .validity {
      font-size: 20px;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 15px;
    }

    /* Black Horizontal Line below Validity */
    .bottom-section {
      width: 100%;
      display: flex;
      border-top: 1px solid #000; /* Validity ke niche black line */
      margin-top: 10px;
      background: transparent;
    }

    /* Left Signature Area */
    .sig-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 15px;
      border-right: 1px solid #000; /* Vertical Black Line between Sig and QR */
    }

    .sig-img {
      max-width: 130px;
      max-height: 85px;
      width: auto;
      height: auto;
      display: block;
    }

    /* Right QR Code Area */
    .qr-box {
      width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .qr-code {
      width: 85px;
      height: 85px;
      display: block;
    }

    .footer {
      margin-top: auto;
      padding: 15px;
      color: #333;
      font-size: 13px;
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">E- Bus Pass</div>

  <div class="card">
    <div class="main-title">DTC And Cluster Bus Pass</div>
    
    <!-- Profile Photo -->
    <img src="profile.jpg" class="user-img" alt="Photo">

    <!-- Pass Details -->
    <div class="name">Manish Maurya</div>
    <div class="pass-type">Student All route AC/Non AC</div>
    
    <!-- Blinking Number -->
    <div class="pass-number-container">
      <span class="pass-label">Bus Pass No. </span>
      <span class="blink-number">7502042368431</span>
    </div>
    
    <div class="validity">Valid from 15/09/2026 to 14/12/2026</div>

    <!-- Black Divider Border Lines Section -->
    <div class="bottom-section">
      <div class="sig-box">
        <img src="sig.png" class="sig-img" alt="Signature">
      </div>
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://deepakmaurya632.github.io/DTC_Bus_Pass/" class="qr-code" alt="QR">
      </div>
    </div>
  </div>

  <div class="footer">
    Copyright &#65533; - Delhi e-Governance Society 2026
  </div>

</body>
</html>
