<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | e-Bus Pass</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      /* Main Background Colors (Sky Blue Theme) */
      background-color: #e0f2f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      color: #00838f;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      background: #ffffff;
      width: 100%;
      text-align: center;
      padding: 12px 0;
    }

    /* Main Card Box */
    .card {
      background-color: #ffffff;
      background-image: url('dtc-watermark.png');
      background-repeat: repeat;
      background-size: 150px 75px;
      width: 92%;
      max-width: 550px;
      padding-top: 20px;
      text-align: center;
      border: 1px solid #ccc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .main-title {
  color: #00838f; /* या #00a8cc */
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
  
  /* नीचे रेखा जोड़ने के लिए: */
  border-bottom: 1px solid #cccccc; /* पतली ग्रे लाइन */
  padding-bottom: 8px;            /* टेक्स्ट और लाइन के बीच थोड़ी जगह */
}

    /* Profile Image */
    .user-img {
      width: 150px;
      height: 175px;
      object-fit: cover;
      border: 1px solid #666;
      margin: 0 auto 12px auto;
      display: block;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      color: #000000;
      margin-bottom: 12px;
    }

    .pass-type {
      font-size: 20px;
      font-weight: bold;
      color: #000000;
      margin-bottom: 12px;
    }

    .pass-number-container {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .pass-label {
      color: #000000;
    }

    /* Blinking Green Number */
    .blink-number {
      color: #5cb85c;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    .validity {
      font-size: 20px;
      font-weight: bold;
      color: #d9534f;
      margin-bottom: 15px;
    }

    /* Light Grey/Black Borders (Original Jaise Halki Line) */
    .bottom-section {
      width: 100%;
      display: flex;
      border-top: 1px solid #cccccc; /* Halki Horizontal Line */
      background: transparent;
    }

    .sig-box {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-right: 1px solid #cccccc; /* Halki Vertical Dividing Line */
    }

    .sig-img {
      max-width: 130px;
      max-height: 80px;
      width: auto;
      height: auto;
      display: block;
    }

    .qr-box {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .qr-code {
      width: 85px;
      height: 85px;
      display: block;
    }

    /* Dark Teal Bottom Footer Area */
    .footer-wrapper {
      width: 100%;
      background-color: #00838f;
      margin-top: auto;
      padding: 25px 0;
      text-align: center;
    }

    .footer {
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">E- Bus Pass</div>

  <div class="card">
    <div class="main-title header">DTC And Cluster Bus Pass</div>
    
    <!-- User Image -->
    <img src="profile.jpg" class="user-img" alt="Photo">

    <!-- Pass Info -->
    <div class="name">Manish Maurya</div>
    <div class="pass-type">Student All route AC/Non AC</div>
    
    <!-- Blinking Pass Number -->
    <div class="pass-number-container">
      <span class="pass-label">Bus Pass No. </span>
      <span class="blink-number">7502042368431</span>
    </div>
    
    <div class="validity">Valid from 15/09/2026 to 14/12/2026</div>

    <!-- Light Border Section for Signature and QR Code -->
    <div class="bottom-section">
      <div class="sig-box">
        <img src="sig.png" class="sig-img" alt="Signature">
      </div>
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://deepakmaurya632.github.io/DTC_Bus_Pass/" class="qr-code" alt="QR">
      </div>
    </div>
  </div>

  <!-- Bottom Dark Teal Background Area -->
  <div class="footer-wrapper">
    <div class="footer">
      Copyright &#65533; - Delhi e-Governance Society 2026
    </div>
  </div>

</body>
</html>
