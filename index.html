<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | e-Bus Pass</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #e3f2fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      color: #1b8a90;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 10px 0;
      background: white;
      width: 100%;
      text-align: center;
      padding: 10px 0;
    }

    /* Main Pass Box */
    .card {
      background-color: #ffffff;
      /* Watermark: aapki upload ki hui dtc-watermark.png image repeat hogi */
      background-image: url('dtc-watermark.png');
      background-repeat: repeat;
      background-size: 150px 80px;
      width: 92%;
      max-width: 600px;
      padding: 20px 15px 110px 15px; /* Bottom spacing for Sig & QR */
      position: relative;
      text-align: center;
      border: 1px solid #ccc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .main-title {
      color: #000;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* Center User Image */
    .user-img {
      width: 150px;
      height: 180px;
      object-fit: cover;
      border: 1px solid #777;
      margin: 0 auto 12px auto;
      display: block;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      color: #000;
      margin-bottom: 12px;
    }

    .pass-type {
      font-size: 19px;
      font-weight: bold;
      color: #000;
      margin-bottom: 12px;
    }

    .pass-number-container {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .pass-label {
      color: #000;
    }

    /* Green Number Blinking */
    .blink-number {
      color: #72b270;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    .validity {
      font-size: 19px;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 15px;
    }

    /* Fixed Bottom Signature (Left Side) */
    .sig-container {
      position: absolute;
      left: 15px;
      bottom: 15px;
      text-align: center;
      width: 120px;
    }
    .sig-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Fixed Bottom QR Code (Right Side) */
    .qr-code {
      position: absolute;
      right: 15px;
      bottom: 15px;
      width: 85px;
      height: 85px;
    }

    .footer {
      margin-top: auto;
      padding: 15px;
      color: #333;
      font-size: 13px;
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">E- Bus Pass</div>

  <div class="card">
    <div class="main-title">DTC And Cluster Bus Pass</div>
    
    <!-- User Photo -->
    <img src="profile.jpg" class="user-img" alt="Photo">

    <!-- Pass Info -->
    <div class="name">Manish Maurya</div>
    <div class="pass-type">Student All route AC/Non AC</div>
    
    <!-- Blinking Pass Number -->
    <div class="pass-number-container">
      <span class="pass-label">Bus Pass No. </span>
      <span class="blink-number">7502042368431</span>
    </div>
    
    <div class="validity">Valid from 15/09/2026 to 14/12/2026</div>

    <!-- Signature -->
    <div class="sig-container">
      <img src="sig.png" class="sig-img" alt="Signature">
    </div>

    <!-- QR Code -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=7502042368431" class="qr-code" alt="QR">
  </div>

  <div class="footer">
    Copyright &#65533; - Delhi e-Governance Society 2026
  </div>

</body>
</html>
